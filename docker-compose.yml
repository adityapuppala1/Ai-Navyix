services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: navyix
      POSTGRES_USER: navyix
      POSTGRES_PASSWORD: navyix_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - navyix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navyix -d navyix"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  navyix_pg:
