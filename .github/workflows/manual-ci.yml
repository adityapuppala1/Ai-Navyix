name: Manual quality checks
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for manual execution
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: navyix-manual-checks
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
# IMPORTANT: no push, pull_request, schedule or deployment trigger.
